<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports | Feel Good Spa Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body data-page="reports">
  <div class="dash-shell">
    <nav class="float-nav" id="floatNav" aria-label="Admin navigation"></nav>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="demo-banner"><i class="bi bi-info-circle"></i> Demonstration data — stored in this browser only</div>
        <div class="page-head">
          <div>
            <h1>Reports & analytics</h1>
            <p>Sample performance metrics and exports.</p>
          </div>
          <div id="pageActions"></div>
        </div>

        <div class="toolbar" id="filters"></div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="grid-2">
          <div class="panel"><div class="panel-head"><h2>Booking trends</h2></div><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
          <div class="panel"><div class="panel-head"><h2>Popular services</h2></div><div class="chart-box"><canvas id="serviceChart"></canvas></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Report table</h2><button class="btn-admin ghost sm" type="button" id="exportReport">Export CSV</button></div>
          <div class="table-wrap"><table class="admin-table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>

  <script src="assets/js/pages.js"></script>
</body>
</html>
