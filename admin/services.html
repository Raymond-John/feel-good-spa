<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Services | Feel Good Spa Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body data-page="services">
  <div class="dash-shell">
    <nav class="float-nav" id="floatNav" aria-label="Admin navigation"></nav>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="demo-banner"><i class="bi bi-info-circle"></i> Demonstration data — stored in this browser only</div>
        <div class="page-head">
          <div>
            <h1>Services</h1>
            <p>Manage the spa treatment menu.</p>
          </div>
          <div id="pageActions"></div>
        </div>

        <div class="panel">
          <div class="toolbar" id="filters"></div>
          <div id="viewToggle" class="mb-3"></div>
          <div class="table-wrap"><table class="admin-table" id="dataTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
          <div class="card-grid" id="cardGrid" style="display:none"></div>
          <div class="pagination-bar" id="pager"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal fade" id="entityModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="entityModalTitle">Record</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="entityModalBody"></div>
    <div class="modal-footer" id="entityModalFooter"></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>

  <script src="assets/js/pages.js"></script>
</body>
</html>
