<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings | Feel Good Spa Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body data-page="settings">
  <div class="dash-shell">
    <nav class="float-nav" id="floatNav" aria-label="Admin navigation"></nav>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="demo-banner"><i class="bi bi-info-circle"></i> Demonstration data — stored in this browser only</div>
        <div class="page-head">
          <div>
            <h1>Settings</h1>
            <p>General, booking, notification and profile preferences.</p>
          </div>
          <div id="pageActions"></div>
        </div>

        <div class="tabs-lux">
          <button type="button" class="active" data-tab="set-general">General</button>
          <button type="button" data-tab="set-booking">Booking</button>
          <button type="button" data-tab="set-notify">Notifications</button>
          <button type="button" data-tab="set-appear">Appearance</button>
          <button type="button" data-tab="set-profile">Profile</button>
        </div>
        <form id="settingsForm">
          <div class="tab-pane active" id="set-general"><div class="panel" id="generalFields"></div></div>
          <div class="tab-pane" id="set-booking"><div class="panel" id="bookingFields"></div></div>
          <div class="tab-pane" id="set-notify"><div class="panel" id="notifyFields"></div></div>
          <div class="tab-pane" id="set-appear"><div class="panel" id="appearFields"></div></div>
          <div class="tab-pane" id="set-profile"><div class="panel" id="profileFields"></div></div>
          <button class="btn-admin" type="submit">Save settings</button>
          <button class="btn-admin ghost" type="button" id="resetDemo">Reset all demo data</button>
        </form>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>

  <script src="assets/js/pages.js"></script>
</body>
</html>
