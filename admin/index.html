<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Feel Good Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body data-page="login">
  <div class="login-page">
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark" style="width:42px;height:42px;border-radius:50%;border:1px solid var(--navy);display:inline-flex;align-items:center;justify-content:center;color:var(--navy)"><i class="bi bi-flower1"></i></span>
        <span>
          <strong style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy)">Feel <em style="color:var(--gold);font-style:italic">Good</em> Spa</strong>
          <span style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">Admin console</span>
        </span>
      </div>
      <h1>Welcome back</h1>
      <p>Frontend demonstration login — no real authentication. Sample credentials are prefilled.</p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" required value="raymond@feelgoodspa.example" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" required value="demo1234" />
          <div class="form-hint">Any password works in this demo.</div>
        </div>
        <button class="btn-admin w-100" type="submit">Sign in to dashboard</button>
      </form>
      <p class="form-hint mt-3 mb-0">Demo data is stored in your browser via localStorage.</p>
    </div>
  </div>
  <script src="assets/js/data.js"></script>
  <script>
    if (FGS.getSession()) location.href = "dashboard.html";
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const data = FGS.load();
      const admin = data.admins.find(function (a) { return a.email.toLowerCase() === email.toLowerCase(); }) || data.admins[0];
      FGS.setSession({ name: admin.name, email: admin.email, role: admin.role, image: admin.image });
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
